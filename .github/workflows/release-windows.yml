name: Release Windows Portable Packages

on:
  pull_request:
    paths:
      - 'init.ts'
      - 'init.lua'
      - 'Script/**'
      - 'assets/**'
      - 'art-source/brand/icons/**'
      - 'tools/windows-launcher/**'
      - 'tools/make-windows-pack.sh'
      - 'tools/make-dora-source-pack.sh'
      - 'tools/windows-boot.lua'
      - 'tools/windows-game-id'
      - 'tools/windows-pack-README.md'
      - 'tools/audit-assets.py'
      - '.github/workflows/release-windows.yml'
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本标识（如 v0.1.0-rc1；留空默认取 tag 或短 commit）'
        required: false
        default: ''
        type: string
      publish_release:
        description: '是否同时发布 GitHub Release（仅手动触发时生效；tag 触发默认发布）'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  DORA_VERSION: v1.10.2
  EXE_NAME: WestwardWatch
  RUNTIME_NAME: WestwardWatchRuntime

jobs:
  prepare-win-bins:
    name: Build Native Windows Launcher & Patch Runtime PE Metadata
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      win_ver_dot: ${{ steps.meta.outputs.win_ver_dot }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Resolve package version & numeric Windows PE version
        id: meta
        shell: pwsh
        run: |
          $inputVer = "${{ inputs.version }}".Trim()
          if ($inputVer -ne "") {
            $ver = $inputVer
          } elseif ("${{ github.ref }}" -like "refs/tags/*") {
            $ver = "${{ github.ref }}".Substring("refs/tags/".Length)
          } else {
            $ver = "dev-$("${{ github.sha }}".Substring(0, 7))"
          }

          if ($ver -match '^v?(\d+)\.(\d+)\.(\d+)') {
            $maj = [int]$matches[1]; $min = [int]$matches[2]; $pat = [int]$matches[3]
          } else {
            $maj = 0; $min = 1; $pat = 0
          }
          $winDot = "$maj.$min.$pat.0"
          $winComma = "$maj,$min,$pat,0"

          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "win_ver_dot=$winDot" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "win_ver_comma=$winComma" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Packaging version=$ver, PE version=$winDot"

      - name: Compile native Win32 GUI launcher (WestwardWatch.exe)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL (
            echo Visual Studio C++ build tools not found >&2
            exit /b 1
          )
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          mkdir "%RUNNER_TEMP%\win-bins"
          pushd tools\windows-launcher
          rc /nologo /d "APP_VER_NUM=${{ steps.meta.outputs.win_ver_comma }}" /d "APP_VER_STR=\"${{ steps.meta.outputs.version }}\"" /fo "%RUNNER_TEMP%\win-bins\launcher.res" launcher.rc
          if errorlevel 1 exit /b 1
          cl /nologo /O2 /W4 /MT /DUNICODE /D_UNICODE /D_CRT_SECURE_NO_WARNINGS launcher.c "%RUNNER_TEMP%\win-bins\launcher.res" /Fe:"%RUNNER_TEMP%\win-bins\${EXE_NAME}.exe" /link /SUBSYSTEM:WINDOWS /ENTRY:wWinMainCRTStartup user32.lib kernel32.lib
          if errorlevel 1 exit /b 1
          popd
          dir "%RUNNER_TEMP%\win-bins\${EXE_NAME}.exe"

      - name: Download Dora SSR Windows binaries and patch icons & PE metadata with rcedit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tmp = $env:RUNNER_TEMP
          $engDir = Join-Path $tmp "dora-engine"
          $d3dDir = Join-Path $tmp "win-d3d12"
          $oglDir = Join-Path $tmp "win-opengl"
          $rceditDir = Join-Path $tmp "rcedit"
          $outDir = Join-Path $tmp "win-bins"
          New-Item -ItemType Directory -Path $engDir, $d3dDir, $oglDir, $rceditDir, (Join-Path $outDir "d3d12"), (Join-Path $outDir "opengl") -Force | Out-Null

          gh release download "$env:DORA_VERSION" --repo IppClub/Dora-SSR --dir $engDir `
            --pattern "dora-ssr-$env:DORA_VERSION-windows-x64.zip" `
            --pattern "dora-ssr-$env:DORA_VERSION-windows-x64-opengl.zip" `
            --pattern "SHA256SUMS"

          $sums = Get-Content (Join-Path $engDir "SHA256SUMS")
          foreach ($zipName in @("dora-ssr-$env:DORA_VERSION-windows-x64.zip", "dora-ssr-$env:DORA_VERSION-windows-x64-opengl.zip")) {
            $line = $sums | Where-Object { $_ -match ([regex]::Escape($zipName) + '$') } | Select-Object -First 1
            if (-not $line -or $line -notmatch '^([0-9a-fA-F]{64})\s+') {
              throw "Missing SHA256SUMS entry for $zipName"
            }
            $expected = $matches[1].ToLower()
            $actual = (Get-FileHash -Algorithm SHA256 -Path (Join-Path $engDir $zipName)).Hash.ToLower()
            if ($actual -ne $expected) {
              throw "SHA256 mismatch for $zipName: expected $expected got $actual"
            }
            Write-Host "Verified $zipName ($actual)"
          }

          Expand-Archive -Path (Join-Path $engDir "dora-ssr-$env:DORA_VERSION-windows-x64.zip") -DestinationPath $d3dDir -Force
          Expand-Archive -Path (Join-Path $engDir "dora-ssr-$env:DORA_VERSION-windows-x64-opengl.zip") -DestinationPath $oglDir -Force

          gh release download "v2.0.0" --repo electron/rcedit --dir $rceditDir --pattern "rcedit-x64.exe"
          $rcedit = Join-Path $rceditDir "rcedit-x64.exe"
          $ico = (Resolve-Path "art-source/brand/icons/WestwardWatch.ico").Path
          $verStr = "${{ steps.meta.outputs.version }}"
          $winDot = "${{ steps.meta.outputs.win_ver_dot }}"

          foreach ($pair in @(
            @{ Name = "d3d12"; SearchRoot = $d3dDir; Dest = (Join-Path $outDir "d3d12\Dora.exe") },
            @{ Name = "opengl"; SearchRoot = $oglDir; Dest = (Join-Path $outDir "opengl\Dora.exe") }
          )) {
            $srcExe = (Get-ChildItem -Path $pair.SearchRoot -Recurse -Filter "Dora.exe" | Select-Object -First 1).FullName
            Copy-Item -Path $srcExe -Destination $pair.Dest -Force
            & $rcedit $pair.Dest `
              --set-icon $ico `
              --set-file-version $winDot `
              --set-product-version $winDot `
              --set-version-string "CompanyName" "Outsider Studio" `
              --set-version-string "FileDescription" "Westward Watch Runtime" `
              --set-version-string "ProductName" "Westward Watch" `
              --set-version-string "InternalName" "$env:RUNTIME_NAME" `
              --set-version-string "OriginalFilename" "$env:RUNTIME_NAME.exe" `
              --set-version-string "LegalCopyright" "Copyright (C) 2026 Outsider Studio (Apache-2.0)" `
              --set-version-string "ProductVersion" $verStr
            if ($LASTEXITCODE -ne 0) {
              throw "rcedit failed for $($pair.Name) runtime exe"
            }
            $vi = (Get-Item $pair.Dest).VersionInfo
            Write-Host "Patched $($pair.Name) runtime: ProductName=$($vi.ProductName), FileDescription=$($vi.FileDescription), FileVersion=$($vi.FileVersion)"
            if ($vi.ProductName -ne "Westward Watch") {
              throw "Unexpected ProductName after rcedit: $($vi.ProductName)"
            }
          }

          $launcherVi = (Get-Item (Join-Path $outDir "$env:EXE_NAME.exe")).VersionInfo
          Write-Host "Built launcher: ProductName=$($launcherVi.ProductName), FileDescription=$($launcherVi.FileDescription), FileVersion=$($launcherVi.FileVersion)"
          if ($launcherVi.ProductName -ne "Westward Watch") {
            throw "Unexpected launcher ProductName: $($launcherVi.ProductName)"
          }

      - name: Upload prepared Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: win-prepared-bins
          path: |
            ${{ runner.temp }}/win-bins/${{ env.EXE_NAME }}.exe
            ${{ runner.temp }}/win-bins/d3d12/Dora.exe
            ${{ runner.temp }}/win-bins/opengl/Dora.exe
          if-no-files-found: error
          retention-days: 1

  package:
    name: Assemble Windows (D3D12 + OpenGL) & Dora Source Packages
    needs: prepare-win-bins
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ needs.prepare-win-bins.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Download prepared Windows executables
        uses: actions/download-artifact@v4
        with:
          name: win-prepared-bins
          path: ${{ runner.temp }}/win-bins

      - name: Run repository and asset audits
        run: |
          python3 tools/check-repo.py
          python3 tools/audit-assets.py

      - name: Download and verify official Dora SSR Windows runtime packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/dora-engine" "$RUNNER_TEMP/win-d3d12" "$RUNNER_TEMP/win-opengl"
          gh release download "${DORA_VERSION}" --repo IppClub/Dora-SSR --dir "$RUNNER_TEMP/dora-engine" \
            --pattern "dora-ssr-${DORA_VERSION}-windows-x64.zip" \
            --pattern "dora-ssr-${DORA_VERSION}-windows-x64-opengl.zip" \
            --pattern "SHA256SUMS"
          (
            cd "$RUNNER_TEMP/dora-engine"
            grep -E "dora-ssr-${DORA_VERSION}-windows-x64(-opengl)?\.zip$" SHA256SUMS | sha256sum -c -
          )
          unzip -q "$RUNNER_TEMP/dora-engine/dora-ssr-${DORA_VERSION}-windows-x64.zip" -d "$RUNNER_TEMP/win-d3d12"
          unzip -q "$RUNNER_TEMP/dora-engine/dora-ssr-${DORA_VERSION}-windows-x64-opengl.zip" -d "$RUNNER_TEMP/win-opengl"

      - name: Assemble portable ZIP bundles
        run: |
          D3D12_DIR="$(dirname "$(find "$RUNNER_TEMP/win-d3d12" -maxdepth 2 -name Dora.exe | head -n 1)")"
          OPENGL_DIR="$(dirname "$(find "$RUNNER_TEMP/win-opengl" -maxdepth 2 -name Dora.exe | head -n 1)")"
          mkdir -p "$RUNNER_TEMP/release-out"

          bash tools/make-windows-pack.sh \
            --backend d3d12 \
            --engine-dir "$D3D12_DIR" \
            --launcher "$RUNNER_TEMP/win-bins/${EXE_NAME}.exe" \
            --runtime-exe "$RUNNER_TEMP/win-bins/d3d12/Dora.exe" \
            --out-dir "$RUNNER_TEMP/release-out" \
            --version "${{ needs.prepare-win-bins.outputs.version }}" \
            --exe-name "${EXE_NAME}" \
            --runtime-name "${RUNTIME_NAME}"

          bash tools/make-windows-pack.sh \
            --backend opengl \
            --engine-dir "$OPENGL_DIR" \
            --launcher "$RUNNER_TEMP/win-bins/${EXE_NAME}.exe" \
            --runtime-exe "$RUNNER_TEMP/win-bins/opengl/Dora.exe" \
            --out-dir "$RUNNER_TEMP/release-out" \
            --version "${{ needs.prepare-win-bins.outputs.version }}" \
            --exe-name "${EXE_NAME}" \
            --runtime-name "${RUNTIME_NAME}"

          bash tools/make-dora-source-pack.sh \
            --out-dir "$RUNNER_TEMP/release-out" \
            --version "${{ needs.prepare-win-bins.outputs.version }}"

          (
            cd "$RUNNER_TEMP/release-out"
            sha256sum ./*.zip | sed 's| \./|  |' > SHA256SUMS.txt
            cat SHA256SUMS.txt
          )

      - name: Upload release bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-bundles
          path: |
            ${{ runner.temp }}/release-out/*.zip
            ${{ runner.temp }}/release-out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  smoke-windows:
    name: Windows Cold-Start Smoke Test (Direct Exe + Default saves/ + Readonly Fallback)
    needs: package
    runs-on: windows-latest
    steps:
      - name: Download release bundle artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-bundles
          path: ${{ runner.temp }}\bundles

      - name: Verify ZIP checksums on Windows
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "bundles"
          $lines = Get-Content (Join-Path $dir "SHA256SUMS.txt")
          foreach ($line in $lines) {
            if ($line -match '^([0-9a-fA-F]{64})\s+(.+)$') {
              $expected = $matches[1].ToLower()
              $file = Join-Path $dir $matches[2].Trim()
              $actual = (Get-FileHash -Algorithm SHA256 -Path $file).Hash.ToLower()
              if ($actual -ne $expected) {
                throw "SHA256 mismatch for ${file}: expected $expected got $actual"
              }
              Write-Host "SHA256 OK: $($matches[2].Trim())"
            }
          }

      - name: Verify OpenGL compatibility package structure, trimming, and PE metadata
        shell: pwsh
        run: |
          $ver = "${{ needs.package.outputs.version }}"
          $zip = Join-Path $env:RUNNER_TEMP "bundles\${env:EXE_NAME}-${ver}-windows-x64-opengl.zip"
          $dest = Join-Path $env:RUNNER_TEMP "verify-opengl"
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $root = Join-Path $dest "${env:EXE_NAME}"
          foreach ($req in @(
            "${env:EXE_NAME}.exe",
            "LICENSE",
            "README.md",
            "saves",
            "saves\slots",
            "saves\backups",
            "saves\logs",
            "runtime\${env:RUNTIME_NAME}.exe",
            "runtime\dora-game-id",
            "runtime\VERSION.txt",
            "runtime\Script\init.lua",
            "runtime\Script\main.lua",
            "runtime\Script\Lib\lualib_bundle.lua",
            "runtime\Script\watch\target.lua",
            "runtime\Script\watch\targets\windows\index.lua",
            "runtime\Script\watch\input\kbm_core.lua",
            "runtime\assets\art\title.png",
            "runtime\assets\art\brand\game_logo_h.png",
            "runtime\assets\art\brand\team_logo_dark.png",
            "runtime\assets\art\brand\app_icon.png",
            "runtime\assets\audio\combat\shot.wav"
          )) {
            $p = Join-Path $root $req
            if (-not (Test-Path $p)) { throw "Missing required entry in OpenGL pack: $req" }
          }
          foreach ($bad in @(
            "启动-向西守望.cmd",
            "${env:EXE_NAME}.ico",
            "SHA256SUMS",
            "dora-game-id",
            "runtime\www",
            "runtime\Doc",
            "runtime\dora-wa",
            "runtime\dora_godot.dll",
            "runtime\wa.dll",
            "runtime\gamecontrollerdb.txt",
            "runtime\Audio",
            "runtime\Font",
            "runtime\Image",
            "runtime\Script\Dev",
            "runtime\Script\Tools",
            "runtime\Script\Lib\Agent",
            "runtime\Script\Lib\Dora",
            "runtime\Script\watch\testdrive.lua",
            "runtime\Script\watch\platform_mobile.lua",
            "runtime\Script\watch\input\aim_assist.lua",
            "runtime\Script\watch\input\touch_core.lua",
            "runtime\Script\watch\input\gamepad_core.lua",
            "runtime\Script\watch\targets\android",
            "runtime\Script\watch\targets\handheld",
            "runtime\Script\watch\targets\web"
          )) {
            if (Test-Path (Join-Path $root $bad)) { throw "Forbidden/redundant entry present in OpenGL pack: $bad" }
          }
          $lvi = (Get-Item (Join-Path $root "${env:EXE_NAME}.exe")).VersionInfo
          $rvi = (Get-Item (Join-Path $root "runtime\${env:RUNTIME_NAME}.exe")).VersionInfo
          if ($lvi.ProductName -ne "Westward Watch" -or $rvi.ProductName -ne "Westward Watch") {
            throw "PE ProductName mismatch: launcher='$($lvi.ProductName)', runtime='$($rvi.ProductName)'"
          }
          Write-Host "OpenGL package clean layout and PE metadata verified."

      - name: Run D3D12 portable cold-start smoke test via root WestwardWatch.exe
        shell: pwsh
        run: |
          $ver = "${{ needs.package.outputs.version }}"
          $zip = Join-Path $env:RUNNER_TEMP "bundles\${env:EXE_NAME}-${ver}-windows-x64.zip"
          $cnBase = Join-Path $env:RUNNER_TEMP "向西守望 便携验收测试"
          New-Item -ItemType Directory -Path $cnBase -Force | Out-Null
          Expand-Archive -Path $zip -DestinationPath $cnBase -Force
          $packDir = Join-Path $cnBase "${env:EXE_NAME}"
          $exe = Join-Path $packDir "${env:EXE_NAME}.exe"
          $gameId = (Get-Content (Join-Path $packDir "runtime\dora-game-id") -Raw).Trim()
          $appdataDir = Join-Path $env:APPDATA "IppClub\DoraGame-$gameId"

          function Dump-DoraLogs($label) {
            Write-Host "=== Diagnostic logs ($label) ==="
            foreach ($cand in @(
              (Join-Path $appdataDir "log.txt"),
              (Join-Path $packDir "saves\logs\crash.log"),
              (Join-Path $packDir "saves\logs\engine.log")
            )) {
              if (Test-Path $cand) {
                Write-Host "--- $cand ---"
                Get-Content $cand -Tail 60
              }
            }
          }

          # Round 1: default out-of-the-box portable saves/ mode launched directly via root WestwardWatch.exe (cwd != game dir)
          Set-Content -Path (Join-Path $packDir ".ci-smoke-test") -Value "1" -Encoding ascii
          $proc = Start-Process -FilePath $exe -WorkingDirectory $env:RUNNER_TEMP -PassThru
          if (-not $proc.WaitForExit(45000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Dump-DoraLogs "round1-timeout"
            throw "Smoke round 1 timed out after 45s"
          }
          $resultFile = Join-Path $packDir ".ci-smoke-result.txt"
          if (-not (Test-Path $resultFile)) {
            Dump-DoraLogs "round1-missing-result"
            throw "Smoke round 1 did not produce .ci-smoke-result.txt (exit=$($proc.ExitCode))"
          }
          $res1 = Get-Content $resultFile -Raw
          Write-Host "=== Smoke Round 1 (D3D12, Direct WestwardWatch.exe, Default Portable saves/, cwd != game dir) ==="
          Write-Host $res1
          if ($res1 -notmatch "SMOKE_OK" -or $res1 -match "FAIL " -or $res1 -notmatch "portableSave=true" -or $res1 -notmatch "target=windows") {
            Dump-DoraLogs "round1-failed"
            throw "Smoke round 1 failed verification"
          }
          if ($proc.ExitCode -ne 0) {
            Dump-DoraLogs "round1-exit"
            throw "Smoke round 1 exited with non-zero code: $($proc.ExitCode)"
          }

          # Round 2: read-only / non-writable saves/ fallback test (deny write ACL on saves/ -> automatic safe fallback to %APPDATA%)
          Remove-Item $resultFile -Force
          $savesPath = Join-Path $packDir "saves"
          icacls $savesPath /deny "$($env:USERNAME):(OI)(CI)(WD,AD,WA)" | Out-Null
          try {
            $proc2 = Start-Process -FilePath $exe -WorkingDirectory $packDir -PassThru
            if (-not $proc2.WaitForExit(45000)) {
              Stop-Process -Id $proc2.Id -Force -ErrorAction SilentlyContinue
              Dump-DoraLogs "round2-timeout"
              throw "Smoke round 2 timed out after 45s"
            }
            $res2Path = if (Test-Path $resultFile) { $resultFile } else { Join-Path $appdataDir "saves\.ci-smoke-result.txt" }
            if (-not (Test-Path $res2Path)) {
              Dump-DoraLogs "round2-missing-result"
              throw "Smoke round 2 did not produce smoke result (exit=$($proc2.ExitCode))"
            }
            $res2 = Get-Content $res2Path -Raw
            Write-Host "=== Smoke Round 2 (D3D12, Read-Only saves/ Automatic Fallback) ==="
            Write-Host $res2
            if ($res2 -notmatch "SMOKE_OK" -or $res2 -match "FAIL " -or $res2 -notmatch "portableSave=false" -or $res2 -notmatch "saveFallbackReason=readonly") {
              Dump-DoraLogs "round2-failed"
              throw "Smoke round 2 failed verification"
            }
            if ($proc2.ExitCode -ne 0) {
              Dump-DoraLogs "round2-exit"
              throw "Smoke round 2 exited with non-zero code: $($proc2.ExitCode)"
            }
          } finally {
            icacls $savesPath /remove:d $env:USERNAME | Out-Null
          }

  publish-release:
    name: Publish GitHub Release
    needs: [package, smoke-windows]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release bundle artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-bundles
          path: ${{ runner.temp }}/bundles

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ needs.package.outputs.version }}"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          # 《向西守望》${VER} 便携发行版

          本版本已通过仓库结构校验、静态资产与中文字库审计，以及 Windows CI 中文路径双击冷启动与便携存档/只读降级自动化冒烟验收。

          ## 下载说明（免安装、绿色便携）

          | 文件 | 适用场景 |
          | --- | --- |
          | \`${EXE_NAME}-${VER}-windows-x64.zip\` | **推荐（Windows 10/11 标准版）**：Direct3D 12 后端，完整解压后直接双击根目录 \`${EXE_NAME}.exe\` 即玩 |
          | \`${EXE_NAME}-${VER}-windows-x64-opengl.zip\` | **兼容版（Windows 10/11 OpenGL）**：老旧显卡或虚拟机若提示 Direct3D 12 初始化失败请下载此版本 |
          | \`${EXE_NAME}-${VER}-dora-source.zip\` | **Dora SSR v1.10.2 兼容源码包**：供 Dora 开源社区奖审核及跨平台 Dora 客户端直接运行 |
          | \`SHA256SUMS.txt\` | 发行包 SHA-256 校验清单 |

          ## 便携与存档说明

          - 默认所有存档与设置均保存在游戏目录 \`saves/\` 内（\`profile.sav\`、\`autosave.sav\`、\`slots/slot_1..3.sav\`、\`settings.ini\`、\`backups/\`、\`logs/\`），整包拷贝即可随身携带；
          - 支持自动存档 + 3 个手动存档槽位，旧版存档首次启动自动无损迁移；若解压至只读目录则自动回退至用户目录；
          - 全屏切换快捷键：\`F11\` 或 \`Alt+Enter\`（自动保存）；标题页与暂停菜单均提供「读取存档 / 存取档案」「游戏设置」与「退出游戏」。
          EOF

          # 保留已有 Release Notes（避免覆盖 Android/Web 并发写入的说明）；仅在创建或尚未含多端说明时更新
          if gh release view "${VER}" >/dev/null 2>&1; then
            gh release upload "${VER}" "$RUNNER_TEMP/bundles/"* --clobber
          else
            PRERELEASE_FLAG=""
            if [[ "${VER}" == *-* ]]; then
              PRERELEASE_FLAG="--prerelease"
            fi
            if ! gh release create "${VER}" "$RUNNER_TEMP/bundles/"* \
              --title "《向西守望》${VER}" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              ${PRERELEASE_FLAG}; then
              # 并发 tag 发布竞态兜底：另一工作流刚建完 Release，直接追加上传资产
              gh release upload "${VER}" "$RUNNER_TEMP/bundles/"* --clobber
            fi
          fi
